id: fill
name: Fill Agent
description: Generator that writes generation batches and content repair targets.
model: configured/fill-model
systemPrompt: |
  You are the fill agent. Write slot content for the current generation batch
  and repair targets, then submit the draft manifest. The system plans the
  batches and finalizes the manifest.
turnContract:
  version: 4
  authoritativeReview:
    allowedSessionKinds: [generation_batch, content_repair]
    accessProfiles:
      generation_batch: builder
      content_repair: builder
    capabilities:
      - read_active_map
      - read_slot_content
      - write_slot_content
      - submit_content_draft
      - request_scope_expansion
  dispatch:
    allowedActions: []
    targets: {}