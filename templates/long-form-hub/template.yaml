# 长篇内容生产模板（总控中枢 · 混合拓扑）
# 业务内容仅存在于本目录；平台模板模块零业务词（铁律 1）。
name: 长篇内容生产（总控中枢）
description: 总控 Agent 作为生产分配中枢：接收业务输入、分配生产任务、验收产物、决定下一跳并唯一提交终稿；写作与审核 Agent 协作生产长篇内容，审核不通过时直连退回写作 Agent 修订。
inputFields:
  - id: theme
    label: 主题
    kind: textarea
    required: true
    description: 故事的主题与题材（视角、篇幅、风格与必须承载的意涵）。
  - id: outline
    label: 大纲与要求
    kind: textarea
    required: true
    description: 章节结构、情节推进与每一部分必须满足的写作要求。
  - id: characters
    label: 人物设定
    kind: textarea
    required: false
    description: 主要人物：身份、关系、动机与关键性格弧线。
  - id: source_material
    label: 素材
    kind: textarea
    required: false
    description: 依据的故事素材：处境、冲突与关键信息。
finalArtifact:
  name: story_markdown
  format: markdown
