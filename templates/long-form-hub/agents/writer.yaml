id: writer
name: 写作 Agent
description: 依据任务指令起草完整章节正文，并按退回意见修订后重新发布完整稿件。
model: deepseek/deepseek-v4-flash
systemPromptFile: prompts/writer-system.md
turnContract:
  version: 2
  production:
    files: [content.md, revision.md]
    sources: [inline, workspace_file]
    formats: [markdown]
  dispatch:
    allowedActions:
      - publish_artifact
    targets:
      publish_artifact:
        - reviewer
