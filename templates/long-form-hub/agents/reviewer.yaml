id: reviewer
name: 审核 Agent
description: 审读章节正文：不通过时直连退回写作 Agent 并给出可操作意见；通过时标注 review 并把输入版本转发给总控。
model: deepseek/deepseek-v4-flash
systemPromptFile: prompts/reviewer-system.md
turnContract:
  version: 2
  annotate:
    files: [review.md]
  dispatch:
    allowedActions:
      - forward_input_version
      - send_message
      - request_human_input
    targets:
      forward_input_version:
        - controller
      send_message:
        - writer
