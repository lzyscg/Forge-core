# 有序 Agent、合法连线与最终出口（长篇内容生产 · v7 混合拓扑）
# 修订小循环（写作↔审核）走直连固定路由；总控管阶段流转与最终交付。
# reviewer→controller 改为 artifact 边（v7：通过时 forward 零复制转交）。
# 总控 send_message 使用候选目标集合（多目标分发）。
agents:
  - controller
  - writer
  - reviewer
routes:
  - from: controller
    to: writer
    kind: message
    label: 分配写作任务
  - from: controller
    to: reviewer
    kind: message
    label: 派发审读任务
  - from: writer
    to: reviewer
    kind: artifact
    label: 提交章节稿件
    inject:
      - { version: input, file: content.md, as: 上一版正文 }
  - from: reviewer
    to: writer
    kind: message
    label: 退回修改意见
    inject:
      - { version: input, file: content.md, as: 上一版正文 }
      - { version: input, file: review.md, as: 返修意见 }
  - from: reviewer
    to: controller
    kind: artifact
    label: 审读结论（通过转交）
    inject:
      - { version: input, file: content.md, as: 通过的章节正文 }
finalOutput:
  name: story_markdown
  format: markdown
  submitters:
    - controller
# 产物结构：一个版本目录含正文、修订说明、审核意见。
artifactSchema:
  files:
    - { name: content.md,  required: true,  producer: writer,   extract: content,  phase: create }
    - { name: revision.md, required: false, producer: writer,   extract: revision, phase: create }
    - { name: review.md,   required: false, producer: reviewer, extract: review,   phase: annotate }
# 模板级进度预算（平台上限 32）：本拓扑每轮修订多一跳，健康跑约 4 回合。
budget:
  maxTurnsSinceHumanAnswer: 16
