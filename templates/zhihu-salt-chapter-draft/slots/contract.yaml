version: 2
slotTypes:
  - id: chapter
    name: 章节
    description: 根容器，承载一章知乎盐选短故事正文。
    specSchema:
      type: object
      additionalProperties: false
    content:
      presence: forbidden
  - id: title
    name: 标题
    description: 章节标题，必须简洁并能承接本章核心变化。
    specSchema:
      type: object
      additionalProperties: false
      properties:
        purpose: { type: string, minLength: 1, maxLength: 500 }
        connective_requirement: { type: string, minLength: 1, maxLength: 500 }
    content:
      presence: required
      schema:
        type: string
        minLength: 1
        maxLength: 120
  - id: opening
    name: 开场
    description: 从正在发生的动作切入，让读者立即进入本章现场。
    specSchema:
      type: object
      additionalProperties: false
      properties:
        action_to_advance: { type: string, minLength: 1, maxLength: 1000 }
        character_state: { type: string, minLength: 1, maxLength: 1000 }
        connective_requirement: { type: string, minLength: 1, maxLength: 1000 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
    content:
      presence: required
      schema:
        type: string
        minLength: 1
        maxLength: 12000
  - id: scene_block
    name: 场景段
    description: 通过可见行动推进因果、人物关系或信息变化的正文场景。
    specSchema:
      type: object
      additionalProperties: false
      properties:
        action_to_advance: { type: string, minLength: 1, maxLength: 1000 }
        character_state: { type: string, minLength: 1, maxLength: 1000 }
        connective_requirement: { type: string, minLength: 1, maxLength: 1000 }
        information_not_to_reveal: { type: string, minLength: 1, maxLength: 1000 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
    content:
      presence: required
      schema:
        type: string
        minLength: 1
        maxLength: 24000
  - id: emotional_closure
    name: 情绪落点
    description: 处理本章情绪回声，但不替后续章节提前总结。
    specSchema:
      type: object
      additionalProperties: false
      properties:
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        tone: { type: string, minLength: 1, maxLength: 500 }
    content:
      presence: required
      schema:
        type: string
        minLength: 1
        maxLength: 6000
  - id: chapter_end
    name: 章节结尾
    description: 留下具体、可追踪、尚未兑现的问题或动作。
    specSchema:
      type: object
      additionalProperties: false
      properties:
        concrete_unresolved_element: { type: string, minLength: 1, maxLength: 1000 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        suspended_momentum: { type: string, minLength: 1, maxLength: 1000 }
    content:
      presence: required
      schema:
        type: string
        minLength: 1
        maxLength: 6000
layoutGrammar:
  rootType: chapter
  productions:
    chapter:
      children:
        kind: sequence
        items:
          - kind: slot
            type: title
          - kind: slot
            type: opening
          - kind: repeat
            min: 1
            max: 16
            item:
              kind: slot
              type: scene_block
          - kind: slot
            type: emotional_closure
          - kind: slot
            type: chapter_end
    title:
      children:
        kind: empty
    opening:
      children:
        kind: empty
    scene_block:
      children:
        kind: empty
    emotional_closure:
      children:
        kind: empty
    chapter_end:
      children:
        kind: empty
accessProfiles:
  - id: editor
    capabilities:
      - read_structure_contract
      - read_map_build_frontier
      - append_map_candidate_chunk
      - finish_map_build
      - read_active_map
      - read_slot_content
      - read_related_context
      - write_slot_content
      - submit_content_draft
      - read_map_repair_staging
      - submit_map_patch
      - write_map_patch
      - request_scope_expansion
  - id: reviewer
    capabilities:
      - read_map_candidate
      - read_active_map
      - read_slot_content
      - read_relation_context
      - submit_map_node_review
      - submit_map_relation_review
      - submit_slot_review
      - submit_relation_review
      - submit_map_whole_finding
      - submit_whole_tree_finding
      - submit_finding_verification
      - complete_review_assignment
relationTypes:
  - id: sequence
    direction: directed
    fromSlotTypes: [scene_block]
    toSlotTypes: [scene_block]
    attributesSchema: {}
    semanticCriterion: 较晚的场景必须在情节次序上自然承接较早的场景；倒叙需要正文明确标注。
    enforcement: blocking
    invalidation:
      direction: downstream
      maxHops: 2
  - id: state_inheritance
    direction: directed
    fromSlotTypes: [scene_block]
    toSlotTypes: [scene_block, opening]
    attributesSchema: {}
    semanticCriterion: 人物或情绪状态必须在后续场景中保持一致，除非正文明确写出变化。
    enforcement: blocking
    invalidation:
      direction: downstream
      maxHops: 3
  - id: information_dependency
    direction: directed
    fromSlotTypes: [scene_block]
    toSlotTypes: [scene_block, emotional_closure, chapter_end]
    attributesSchema: {}
    semanticCriterion: 后段所引用的事实、线索或承诺必须在前段已经铺垫；不得临时引入未铺垫的信息。
    enforcement: advisory
    invalidation:
      direction: downstream
      maxHops: 2
relationshipPolicy:
  mode: optional
reviewPolicy:
  mapReview: required
  contentSelector: content_bearing
  mapBatchTargetSlots: 24
  contentBatchTargetSlots: 24
  assignmentSoftLimit: 64
  wholeMapObservation: required
  wholeContentTreeObservation: required
  reviewAdvisoryRelations: true
  maxRounds: 8
validators:
  - validatorId: structural-completeness
    handlerKey: authoritative.review.completeness
    implementationDigest: fcc008b5609f90af4af77450451f2a74e77f33efa5082cc7dd7a8eeace46041a
    implementationRef:
      kind: builtin
      moduleId: '@forge/authoritative-review'
      exportName: completeness
    trigger: map_candidate_commit
    executionPhase: null
    selector:
      kind: all
    enforcement: blocking
    deterministic: true
    inputContractVersion: 2
    outputContractVersion: 2
    budgetProfileId: authoritative-validator-default
  - validatorId: content-batch-schema
    handlerKey: authoritative.review.slotSchema
    implementationDigest: 6882bd50c5c33d0f0e3c6f442d8a4066aa7ffa601dc68f812059b356915e0046
    implementationRef:
      kind: builtin
      moduleId: '@forge/authoritative-review'
      exportName: slotSchema
    trigger: content_commit
    executionPhase: batch_commit
    selector:
      kind: types
      typeIds: [title, opening, scene_block, emotional_closure, chapter_end]
    enforcement: blocking
    deterministic: true
    inputContractVersion: 2
    outputContractVersion: 2
    budgetProfileId: authoritative-validator-default
  - validatorId: content-plan-coverage
    handlerKey: authoritative.review.coverage
    implementationDigest: 378849932fbd97ac19b5624d38d6bd725bbe073c64b9397910291438d17a4854
    implementationRef:
      kind: builtin
      moduleId: '@forge/authoritative-review'
      exportName: coverage
    trigger: content_commit
    executionPhase: plan_finalize
    selector:
      kind: all
    enforcement: advisory
    deterministic: true
    inputContractVersion: 2
    outputContractVersion: 2
    budgetProfileId: authoritative-validator-default
  - validatorId: seal-output-artifact-path
    handlerKey: authoritative.review.artifactPath
    implementationDigest: 64d0dc74a15fef8f930c28c1cc071b444aa1db47f3656b6db326d5374fe7d7b2
    implementationRef:
      kind: builtin
      moduleId: '@forge/authoritative-review'
      exportName: artifactPath
    trigger: seal_output
    executionPhase: null
    selector:
      kind: all
    enforcement: blocking
    deterministic: true
    inputContractVersion: 2
    outputContractVersion: 2
    budgetProfileId: authoritative-validator-default
assembler:
  abi: forge-assembler/v2
  handlerKey: builtin.zhihu_chapter_markdown.v1
  implementationDigest: 3bd953501644e53f952c83acdfb30c3c4fd3b4a7e0b1e044449871fcc4646157
  implementationRef:
    kind: builtin
    moduleId: src/server/runtime/authoritative-review/builtin-assemblers/zhihu-chapter-v1
    exportName: assembleZhihuChapterV1
  budget:
    timeoutMs: 5000
    maxInputBytes: 67108864
    maxOutputBytes: 8388608
  routes:
    - id: chapter-markdown
      artifactFile: chapter.md
      mediaType: text/markdown
limits:
  schema: { maxSchemaDepth: 4, maxSchemaNodes: 1024, maxEnumItems: 64, maxPatternLength: 128 }
  structure: { maxSlots: 10000, maxTreeDepth: 8, maxChildrenPerSlot: 250 }
  payload: { maxSpecBytesPerSlot: 16384, maxContentBytesPerSlot: 262144, maxScaffoldPayloadBytes: 16777216 }
  draft: { maxChangedSlots: 500, maxDraftBytes: 4194304 }
  attempt:
    maxSlotToolCallsPerAttempt: 128
    maxValidationRunsPerAttempt: 4
    maxValidatorInvocationsPerAttempt: 10000
    maxAggregateValidatorCpuMsPerAttempt: 60000
    maxAggregateValidatorWallClockMsPerAttempt: 120000
    maxValidatorOutputBytesPerAttempt: 4194304
    maxAttemptWallClockMs: 150000
  validation:
    maxValidators: 16
    maxValidatorInvocationsPerGate: 2500
    maxAggregateValidatorCpuMsPerGate: 15000
    maxAggregateValidatorWallClockMsPerGate: 30000
    maxValidatorOutputBytesPerGate: 1048576
    maxIssuesPerRun: 125
  output: { maxArtifactFiles: 16, maxArtifactBytesPerFile: 4194304, maxTotalArtifactBytes: 16777216 }
  relations:
    maxRelationsPerMap: 2000
    maxRelationsPerSlot: 32
    maxRelationImpactHops: 3
    maxRelationClosureNodes: 256
  authoritative:
    maxAssignmentsPerRound: 1000
    maxPlannedWorkItemsPerRound: 4000
    maxConsecutiveAttemptsWithoutProgress: 8
    maxFindingsPerSlot: 16
    maxFindingsPerRelation: 8
    maxFindingsPerRound: 1000
    maxEvidenceBytesPerItem: 4096
    maxEvidenceBytesTotal: 1048576
    maxWriteSlotsPerRepairGrant: 64
    maxScopeExpansionsPerRound: 8
