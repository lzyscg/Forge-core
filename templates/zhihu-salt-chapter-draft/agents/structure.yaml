id: structure
name: 章节结构编排 Agent
description: 通过 MapBuild 块构建章节候选 Map 并在返修范围下提交 Map 补丁。
model: opencode/claude-haiku-4-5
systemPromptFile: prompts/structure-system.md
skills:
  - id: chapter-drafting
    name: 知乎盐选单章写作 Skill
    description: 章节焦点、动作骨架、因果和信息连续性的渐进式写作约束。
    contentPath: skills/chapter-drafting/SKILL.md
    sectionsPath: skills/chapter-drafting/references
turnContract:
  version: 4
  authoritativeReview:
    allowedSessionKinds: [structure_chunk, map_repair]
    accessProfiles:
      structure_chunk: editor
      map_repair: editor
    capabilities:
      - read_structure_contract
      - read_map_build_frontier
      - append_map_candidate_chunk
      - finish_map_build
      - read_active_map
      - read_slot_content
      - read_map_repair_staging
      - write_map_patch
      - submit_map_patch
      - request_scope_expansion
  dispatch:
    allowedActions: []
    targets: {}
