id: fill
name: 章节正文填空 Agent
description: 在激活 Map 的批量与内容返修目标上写入章节正文。
model: opencode/claude-haiku-4-5
systemPromptFile: prompts/fill-system.md
skills:
  - id: chapter-drafting
    name: 知乎盐选单章写作 Skill
    description: 章节正文的动作、因果、人物情绪和压缩检查。
    contentPath: skills/chapter-drafting/SKILL.md
    sectionsPath: skills/chapter-drafting/references
turnContract:
  version: 4
  authoritativeReview:
    allowedSessionKinds: [generation_batch, content_repair]
    accessProfiles:
      generation_batch: editor
      content_repair: editor
    capabilities:
      - read_active_map
      - read_slot_content
      - read_related_context
      - write_slot_content
      - submit_content_draft
      - request_scope_expansion
  dispatch:
    allowedActions: []
    targets: {}
