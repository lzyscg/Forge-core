id: writer
name: 章节写作 Agent
description: 依据章节要求与原始素材，以第一人称写出完整章节正文，并按返修意见修订后重新发布完整稿件。
model: deepseek/deepseek-v4-flash
systemPromptFile: prompts/writer-system.md
skills:
  - id: chapter-drafting
    name: 章节起草
    description: 起草顺序、连续性检查、返修清单与终稿自检。
    contentPath: skills/chapter-drafting/SKILL.md
turnContract:
  version: 2
  production:
    files: [content.md]
    sources:
      - workspace_file
    formats:
      - markdown
  dispatch:
    allowedActions:
      - publish_artifact
    targets:
      publish_artifact: reviewer